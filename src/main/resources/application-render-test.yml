server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  frontend-url: ${FRONTEND_PUBLIC_URL:https://shuji-frontend.onrender.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://shuji-frontend.onrender.com,http://localhost:4200}
  security:
    behind-trusted-proxy: true
  matricula-publica:
    presentacion-identidad: ${MATRICULA_PRESENTACION_IDENTIDAD:true}

logging:
  level:
    root: INFO
    "[com.colegio.shuji]": INFO
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": WARN
