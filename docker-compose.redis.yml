services:
  redis:
    image: redis:7-alpine
    container_name: shuji-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - shuji-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  shuji-redis-data:
