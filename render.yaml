services:
  - type: web
    name: shuji-backend
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    previews:
      generation: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render-test
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_RETURN_URL_HOSTS
        value: shuji-backend.onrender.com
      - key: MERCADOPAGO_SANDBOX
        value: "true"
      - key: MERCADOPAGO_NOTIFICATION_URL
        value: https://shuji-backend.onrender.com/api/v1/pagos/webhook/mercadopago
      - key: MERCADOPAGO_MATRICULA_RETURN_URL
        value: https://shuji-backend.onrender.com/api/v1/pagos/retorno
